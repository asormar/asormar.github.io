<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada — Alejandro Sorolla Martínez</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="./assets/styles.css">
  <style>
    .notfound { display: flex; flex-direction: column; gap: var(--space-md); padding: 120px 0 160px; max-width: 52ch; }
    .notfound__code { font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mark); }
    .notfound__title { font-size: 30px; font-weight: 700; letter-spacing: -0.025em; margin: 0; text-wrap: pretty; overflow-wrap: anywhere; min-width: 0; }
    .notfound__text { font-size: 15px; line-height: 1.65; color: var(--ink-2); margin: 0; }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="masthead">
      <h1 class="masthead__name">Alejandro Sorolla Martínez</h1>
      <div class="masthead__meta"><span class="masthead__note">Valencia</span></div>
    </header>

    <section class="notfound">
      <span class="notfound__code">Error 404</span>
      <p class="notfound__title">Esta página no existe.</p>
      <p class="notfound__text">Puede que el enlace esté mal escrito o que apunte a algo que ya no está aquí. Los proyectos siguen todos en la portada.</p>
      <p class="notfound__text"><a href="/">Volver al índice →</a></p>
    </section>
